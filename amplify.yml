# AWS Amplify Hosting build settings for the MotionLens frontend.
#
# The repo is a monorepo: the Next.js app lives in motionlens-web/ (the
# Python backend at the root is NOT deployed here — it runs on EC2).
# In the Amplify console set the environment variable
#   AMPLIFY_MONOREPO_APP_ROOT = motionlens-web
# so it matches appRoot below.
#
# Next.js SSR (compute) hosting: the build output stays in .next.
# The browser calls the backend directly; its URL is set in
# motionlens-web/lib/api.ts (API_BASE_URL).
version: 1
applications:
  - appRoot: motionlens-web
    frontend:
      phases:
        preBuild:
          commands:
            # Amplify's supported Node versions stop at 22 (local dev
            # runs 24); next 16 needs >= 20.9.
            - nvm install 22
            - nvm use 22
            - node -v
            # Keep npm's download cache inside the app dir so Amplify can
            # cache it; --prefer-offline then skips the registry on a hit.
            - npm ci --cache .npm --prefer-offline --no-audit --no-fund
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          # Not node_modules: npm ci deletes it before installing, so
          # caching it only adds upload/download time.
          - .npm/**/*
          # Next.js incremental compile cache.
          - .next/cache/**/*
